<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f5"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="shine" cx=".3" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <g transform="translate(512 512)" style="mix-blend-mode:multiply">
    <g opacity=".86">
      <ellipse rx="112" ry="196" cy="-170" fill="#ffb21a" transform="rotate(0)"/>
      <ellipse rx="112" ry="196" cy="-170" fill="#ff5a3c" transform="rotate(60)"/>
      <ellipse rx="112" ry="196" cy="-170" fill="#e8418f" transform="rotate(120)"/>
      <ellipse rx="112" ry="196" cy="-170" fill="#7a5cff" transform="rotate(180)"/>
      <ellipse rx="112" ry="196" cy="-170" fill="#1d9bf0" transform="rotate(240)"/>
      <ellipse rx="112" ry="196" cy="-170" fill="#34c759" transform="rotate(300)"/>
    </g>
    <circle r="64" fill="#fff" opacity=".55"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#shine)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="none" stroke="url(#rim)" stroke-width="10"/>
</svg>
